[package]
name = "cvgen"
version = "0.1.0"
edition = "2024"
publish = false
description = "Builds the CV downloads for billsharifzade.github.io from the site's own CV data."

[dependencies]
resvg = { version = "0.49", default-features = false }
rust_xlsxwriter = "0.102"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
typst = "0.15.1"
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
zip = { version = "9", default-features = false, features = ["deflate"] }
