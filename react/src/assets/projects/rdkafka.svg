<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 976 600" width="976" height="600" role="img">
  <!-- Landscape cover plate; colour is revealed on hover (see apiweave.svg). -->
  <defs>
    <radialGradient id="rk-glow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="rk-grid" width="45" height="45" patternUnits="userSpaceOnUse">
      <path d="M45 0H0V45" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="rk-blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <linearGradient id="rk-p0" gradientUnits="userSpaceOnUse" x1="488" y1="102" x2="584" y2="168">
      <stop offset="0%" stop-color="#fb923c"/><stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="rk-p1" gradientUnits="userSpaceOnUse" x1="488" y1="102" x2="424" y2="240">
      <stop offset="0%" stop-color="#fb923c"/><stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="rk-p2" gradientUnits="userSpaceOnUse" x1="488" y1="102" x2="664" y2="312">
      <stop offset="0%" stop-color="#fb923c"/><stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="976" height="600" fill="#05050a"/>
  <rect width="976" height="600" fill="url(#rk-grid)"/>
  <rect width="976" height="600" fill="url(#rk-glow)"/>

  <g fill="#ffffff">
    <circle cx="140" cy="90" r="1.3" fill-opacity="0.15"/><circle cx="300" cy="70" r="1" fill-opacity="0.10"/>
    <circle cx="700" cy="80" r="1.2" fill-opacity="0.14"/><circle cx="905" cy="130" r="1" fill-opacity="0.12"/>
    <circle cx="70" cy="300" r="1" fill-opacity="0.12"/><circle cx="930" cy="420" r="1.2" fill-opacity="0.13"/>
    <circle cx="180" cy="540" r="1" fill-opacity="0.10"/><circle cx="820" cy="555" r="1.1" fill-opacity="0.12"/>
  </g>

  <g font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace">
    <!-- window chrome -->
    <path d="M0 48h976" stroke="#ffffff" stroke-opacity="0.09"/>
    <circle cx="30" cy="24" r="5" fill="#3a3a4a"/><circle cx="50" cy="24" r="5" fill="#3a3a4a"/><circle cx="70" cy="24" r="5" fill="#3a3a4a"/>
    <text x="488" y="31" fill="#6e6e78" font-size="19" text-anchor="middle">rdkafka · async client for the partitioned log</text>

    <!-- producer -->
    <rect x="408" y="56" width="160" height="46" rx="12" fill="#140b06" stroke="#fb923c" stroke-opacity="0.6"/>
    <rect x="408" y="56" width="160" height="46" rx="12" fill="none" stroke="#fb923c" stroke-opacity="0.25" filter="url(#rk-blur)"/>
    <text x="488" y="85" fill="#fb923c" font-size="20" font-weight="700" text-anchor="middle">producer</text>

    <!-- produce paths into each partition head -->
    <g fill="none" stroke-linecap="round">
      <g stroke-width="7" stroke-opacity="0.20" filter="url(#rk-blur)">
        <path d="M488 102 C 488 138, 584 126, 584 168" stroke="url(#rk-p0)"/>
        <path d="M488 102 C 488 152, 424 190, 424 240" stroke="url(#rk-p1)"/>
        <path d="M488 102 C 488 176, 664 240, 664 312" stroke="url(#rk-p2)"/>
      </g>
      <g stroke-width="2.2">
        <path d="M488 102 C 488 138, 584 126, 584 168" stroke="url(#rk-p0)"/>
        <path d="M488 102 C 488 152, 424 190, 424 240" stroke="url(#rk-p1)"/>
        <path d="M488 102 C 488 176, 664 240, 664 312" stroke="url(#rk-p2)"/>
      </g>
      <!-- records in flight -->
      <circle cx="522" cy="122" r="3" fill="#fdba74"/>
      <circle cx="566" cy="146" r="3" fill="#67e8f9"/>
      <circle cx="452" cy="160" r="3" fill="#fdba74"/>
      <circle cx="428" cy="208" r="3" fill="#67e8f9"/>
      <circle cx="560" cy="180" r="3" fill="#fdba74"/>
      <circle cx="648" cy="266" r="3" fill="#67e8f9"/>
    </g>

    <!-- partition p0 : head at cell 5 -->
    <text x="132" y="199" fill="#6e6e78" font-size="17" text-anchor="end">p0</text>
    <g>
      <rect x="150" y="168" width="68" height="50" rx="7" fill="#22d3ee" fill-opacity="0.10"/>
      <rect x="230" y="168" width="68" height="50" rx="7" fill="#22d3ee" fill-opacity="0.18"/>
      <rect x="310" y="168" width="68" height="50" rx="7" fill="#22d3ee" fill-opacity="0.26"/>
      <rect x="390" y="168" width="68" height="50" rx="7" fill="#22d3ee" fill-opacity="0.34"/>
      <rect x="470" y="168" width="68" height="50" rx="7" fill="#22d3ee" fill-opacity="0.44"/>
      <rect x="550" y="168" width="68" height="50" rx="7" fill="#67e8f9" fill-opacity="0.85" stroke="#e0fbff" stroke-opacity="0.8"/>
      <rect x="550" y="168" width="68" height="50" rx="7" fill="#22d3ee" fill-opacity="0.5" filter="url(#rk-blur)"/>
      <rect x="630" y="168" width="68" height="50" rx="7" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.10"/>
      <rect x="710" y="168" width="68" height="50" rx="7" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.10"/>
      <rect x="790" y="168" width="68" height="50" rx="7" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.10"/>
    </g>
    <path d="M464 160v66" stroke="#f472b6" stroke-width="2.5" stroke-dasharray="6 5"/>

    <!-- partition p1 : head at cell 3 -->
    <text x="132" y="271" fill="#6e6e78" font-size="17" text-anchor="end">p1</text>
    <g>
      <rect x="150" y="240" width="68" height="50" rx="7" fill="#22d3ee" fill-opacity="0.12"/>
      <rect x="230" y="240" width="68" height="50" rx="7" fill="#22d3ee" fill-opacity="0.24"/>
      <rect x="310" y="240" width="68" height="50" rx="7" fill="#22d3ee" fill-opacity="0.38"/>
      <rect x="390" y="240" width="68" height="50" rx="7" fill="#67e8f9" fill-opacity="0.85" stroke="#e0fbff" stroke-opacity="0.8"/>
      <rect x="390" y="240" width="68" height="50" rx="7" fill="#22d3ee" fill-opacity="0.5" filter="url(#rk-blur)"/>
      <rect x="470" y="240" width="68" height="50" rx="7" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.10"/>
      <rect x="550" y="240" width="68" height="50" rx="7" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.10"/>
      <rect x="630" y="240" width="68" height="50" rx="7" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.10"/>
      <rect x="710" y="240" width="68" height="50" rx="7" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.10"/>
      <rect x="790" y="240" width="68" height="50" rx="7" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.10"/>
    </g>
    <path d="M384 232v66" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="6 5"/>

    <!-- partition p2 : head at cell 6 -->
    <text x="132" y="343" fill="#6e6e78" font-size="17" text-anchor="end">p2</text>
    <g>
      <rect x="150" y="312" width="68" height="50" rx="7" fill="#22d3ee" fill-opacity="0.08"/>
      <rect x="230" y="312" width="68" height="50" rx="7" fill="#22d3ee" fill-opacity="0.15"/>
      <rect x="310" y="312" width="68" height="50" rx="7" fill="#22d3ee" fill-opacity="0.22"/>
      <rect x="390" y="312" width="68" height="50" rx="7" fill="#22d3ee" fill-opacity="0.29"/>
      <rect x="470" y="312" width="68" height="50" rx="7" fill="#22d3ee" fill-opacity="0.36"/>
      <rect x="550" y="312" width="68" height="50" rx="7" fill="#22d3ee" fill-opacity="0.44"/>
      <rect x="630" y="312" width="68" height="50" rx="7" fill="#67e8f9" fill-opacity="0.85" stroke="#e0fbff" stroke-opacity="0.8"/>
      <rect x="630" y="312" width="68" height="50" rx="7" fill="#22d3ee" fill-opacity="0.5" filter="url(#rk-blur)"/>
      <rect x="710" y="312" width="68" height="50" rx="7" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.10"/>
      <rect x="790" y="312" width="68" height="50" rx="7" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.10"/>
    </g>
    <path d="M624 304v66" stroke="#4ade80" stroke-width="2.5" stroke-dasharray="6 5"/>

    <text x="150" y="390" fill="#6e6e78" font-size="14">offset 0</text>
    <text x="858" y="390" fill="#67e8f9" fill-opacity="0.75" font-size="14" text-anchor="end">log head</text>

    <!-- committed offsets flow down to the consumer group -->
    <g fill="none" stroke-width="2" stroke-dasharray="5 5" stroke-opacity="0.55">
      <path d="M464 226 C 464 330, 260 380, 260 436" stroke="#f472b6"/>
      <path d="M384 298 C 384 360, 504 380, 504 436" stroke="#a78bfa"/>
      <path d="M624 370 C 624 400, 748 404, 748 436" stroke="#4ade80"/>
    </g>

    <text x="150" y="428" fill="#6e6e78" font-size="14">consumer group</text>
    <g>
      <rect x="150" y="436" width="220" height="52" rx="12" fill="#12080d" stroke="#f472b6" stroke-opacity="0.5"/>
      <circle cx="178" cy="462" r="7" fill="#f472b6"/>
      <text x="196" y="469" fill="#ffffff" font-size="19" font-weight="700">c0</text>
      <text x="354" y="468" fill="#6e6e78" font-size="14" text-anchor="end">p0 @ 4</text>
    </g>
    <g>
      <rect x="394" y="436" width="220" height="52" rx="12" fill="#0e0c14" stroke="#a78bfa" stroke-opacity="0.5"/>
      <circle cx="422" cy="462" r="7" fill="#a78bfa"/>
      <text x="440" y="469" fill="#ffffff" font-size="19" font-weight="700">c1</text>
      <text x="598" y="468" fill="#6e6e78" font-size="14" text-anchor="end">p1 @ 3</text>
    </g>
    <g>
      <rect x="638" y="436" width="220" height="52" rx="12" fill="#0b0f0c" stroke="#4ade80" stroke-opacity="0.5"/>
      <circle cx="666" cy="462" r="7" fill="#4ade80"/>
      <text x="684" y="469" fill="#ffffff" font-size="19" font-weight="700">c2</text>
      <text x="842" y="468" fill="#6e6e78" font-size="14" text-anchor="end">p2 @ 6</text>
    </g>

    <!-- footer -->
    <text x="488" y="545" fill="#6e6e78" font-size="16" text-anchor="middle">futures producer · stream consumer · admin · transactions · mocking</text>
    <text x="488" y="572" fill="#8a8a96" font-size="15" text-anchor="middle">rdkafka-sys → vendored librdkafka, C bindings in-tree</text>
  </g>
</svg>
