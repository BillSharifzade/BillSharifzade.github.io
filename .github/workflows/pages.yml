name: Deploy Vite site to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# The build job runs the whole npm dependency tree, so it gets read-only
# credentials; only the deploy job (which runs no npm code) may write Pages
# or mint OIDC tokens.
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version-file: react/.nvmrc
          cache: npm
          cache-dependency-path: react/package-lock.json
      - name: Install deps
        working-directory: react
        run: npm ci
      - name: Build
        working-directory: react
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: react/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
