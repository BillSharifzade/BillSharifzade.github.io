name: Deploy Vite site to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# The build job runs the whole npm dependency tree, so it gets read-only
# credentials; only the deploy job (which runs no npm code) may write Pages
# or mint OIDC tokens.
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version-file: react/.nvmrc
          cache: npm
          cache-dependency-path: react/package-lock.json
      # cvgen (Rust) builds the CV downloads before Vite runs (npm's prebuild).
      # The runner image ships cargo; only the dependency build is worth caching.
      - name: Cache cvgen build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            cvgen/target/
          key: cvgen-${{ runner.os }}-${{ hashFiles('cvgen/Cargo.lock') }}
      - name: Build cvgen
        working-directory: cvgen
        run: cargo build --locked
      - name: Install deps
        working-directory: react
        run: npm ci
      - name: Lint
        working-directory: react
        run: npm run lint
      - name: Build
        working-directory: react
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: react/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
