<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- GitHub Pages can't set response headers, so defense-in-depth CSP ships as a
       meta tag. 'wasm-unsafe-eval' is for react-pdf's embedded WASM (yoga-layout);
       worker-src blob: covers library-spawned workers; Google Fonts is the only
       remaining third-party origin. -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' data: https://abacus.jasoncameron.dev; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'" />
  <link rel="icon" type="image/png" href="/src/assets/arch.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Sharifzoda Bilol — Backend Architect | Rust, High-Load Systems</title>
  <meta name="description"
    content="Sharifzoda Bilol — Backend architect specialising in Rust, high-load systems, and low-level engineering. Fintech, B2G, and telecom platforms. Based in Dushanbe, Tajikistan." />
  <meta name="author" content="Sharifzoda Bilol" />
  <link rel="canonical" href="https://billsharifzade.github.io/" />

  <meta property="og:type" content="profile" />
  <meta property="og:title" content="Sharifzoda Bilol — Backend Architect" />
  <meta property="og:description"
    content="Rust, high-load systems, Linux internals, fintech and B2G platforms." />
  <!-- Messenger scrapers (Telegram, WhatsApp, Discord…) cache previews by
       URL; bump ?v= whenever og.png is redesigned so they re-fetch it. -->
  <meta property="og:image" content="https://billsharifzade.github.io/og.png?v=2" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:url" content="https://billsharifzade.github.io/" />
  <meta property="og:site_name" content="Sharifzoda Bilol" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Sharifzoda Bilol — Backend Architect" />
  <meta name="twitter:description"
    content="Rust, high-load systems, Linux internals, fintech and B2G platforms." />
  <meta name="twitter:image" content="https://billsharifzade.github.io/og.png?v=2" />

  <meta name="theme-color" content="#0b0b12" />
  <!--JSONLD-->

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Variable font (single file, full wght axis): static weights everywhere
       plus real interpolation for the logo's proximity effect. -->
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100..800&display=swap"
    rel="stylesheet">
  <!-- Font Awesome is self-hosted (imported in main.jsx) — no CDN single point
       of failure, no render-blocking third-party stylesheet. -->
  <!-- LCP: the hero avatar — fetch it alongside the JS instead of after it. -->
  <link rel="preload" as="image" href="/src/assets/main_img.webp" fetchpriority="high" />
</head>

<body>
  <div id="root"></div>
  <!--CV_FALLBACK-->
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
